<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quest: Storybook Survey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,700;1,400&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --head-font:"IM Fell English",Georgia,serif; --body-font:"Alegreya",Georgia,serif; --on-accent:#FFF8EC;
  --desk:#D9CCAE; --desk-line:#CFBF9C; --page:#FBF5E4; --page-edge:#E2D2AC; --ink:#33261A; --ink-soft:#5A4632;
  --seal:#8E2C1B; --on-desk:#2E2216; --slot:#EEE3C6; --tint:#EFE2C2; --focus:#1F5FA8;
  --land:#EFE1BC; --shade:#DCC690; --water:#A8C3C6; --tree:#6E8B4E; --roof:#A4553A; --rock:#A39782;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --desk:#1D1A21; --desk-line:#25212A; --page:#F1E6CB; --page-edge:#D3C097; --on-desk:#F1E6CC; --slot:#332D30; }
}
:root[data-theme="dark"]{ --desk:#1D1A21; --desk-line:#25212A; --page:#F1E6CB; --page-edge:#D3C097; --on-desk:#F1E6CC; --slot:#332D30; }
html{height:100%;}
*,*::before,*::after{box-sizing:inherit;}
body{
  margin:0; min-height:100%; background-color:var(--desk);
  background-image:repeating-linear-gradient(45deg,var(--desk-line) 0 1px,transparent 1px 8px),repeating-linear-gradient(-45deg,var(--desk-line) 0 1px,transparent 1px 8px);
  font-family:var(--body-font); color:var(--ink); font-size:18px; line-height:1.55;
}
.wrap{max-width:1120px; margin:0 auto; padding:20px 16px 40px;}
header.tale{color:var(--on-desk); margin-bottom:16px;}
header.tale .realm{font-size:15px; letter-spacing:.04em; opacity:.9;}
header.tale h1{font-family:var(--head-font); font-weight:400; font-size:clamp(30px,6vw,46px); line-height:1.05; margin:2px 0 4px;}
.progress{font-size:16px; min-height:1.55em;}
.layout{display:grid; gap:18px;}
.world{display:contents;}
#mapBox{order:1;} #stage{order:2;} .satchel{order:3;}

.map{background:var(--land); border:2px solid var(--ink); border-radius:4px; padding:5px; box-shadow:0 10px 24px rgba(30,18,6,.28);}
.map svg{display:block; width:100%; height:auto; border:1px solid var(--ink); border-radius:2px;}
.pal-meadow{--land:#EEE3BD; --shade:#CFC583; --tree:#5F8546; --water:#A6C6C6; --roof:#A4553A; --rock:#9D9585;}
.pal-autumn{--land:#F1DFB8; --shade:#DDBA7A; --tree:#B0662F; --water:#9FB9BD; --roof:#7E3B2A; --rock:#A08F7C;}
.pal-frost{--land:#EBEFEF; --shade:#C8D4D8; --tree:#4E7363; --water:#9EC1D6; --roof:#5F749A; --rock:#9AA3AB;}
/* Business setting: wallpaper and colours from core/scenes.js replace the desk */
:root[data-setting]{ --desk:var(--set-bg-now); --desk-line:var(--set-dot-now); --on-desk:var(--set-ink-now); --slot:var(--set-slot-now); }
/* Whole-game colour palette picked in the Game Editor (core/scenes.js); the map takes the palette's colours in rpg.js */
:root[data-palette]{ --desk:var(--pal-bg-now); --desk-line:var(--pal-dot-now); --on-desk:var(--pal-on-bg-now); --slot:var(--pal-slot-now);
  --page:var(--pal-surface); --page-edge:var(--pal-line); --ink:var(--pal-ink); --ink-soft:var(--pal-ink-soft); --tint:var(--pal-tint);
  --seal:var(--pal-accent); --on-accent:var(--pal-on-accent); }
.pal-dusk{--land:#EADCC8; --shade:#C9AE9D; --tree:#5D6B53; --water:#9CA8CA; --roof:#7D4A6B; --rock:#9B8E92;}
.s-ink{stroke:var(--ink); fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round;}
.f-land{fill:var(--land);} .f-shade{fill:var(--shade);} .f-water{fill:var(--water);} .f-tree{fill:var(--tree);}
.f-roof{fill:var(--roof);} .f-rock{fill:var(--rock);} .f-page{fill:var(--page);} .f-ink{fill:var(--ink);} .f-seal{fill:var(--seal);}
.ink{stroke:var(--ink); stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round;}
.s-water{stroke:var(--water); fill:none; stroke-width:7; stroke-linecap:round;}
.route{fill:none; stroke:var(--ink); stroke-width:2.6; stroke-linecap:round; stroke-dasharray:.5 8; opacity:.75;}
.route.walked{stroke:var(--seal); stroke-width:3; stroke-dasharray:7 6; opacity:1;}
.stop .dot{fill:var(--page); stroke:var(--ink); stroke-width:1.6;}
.stop.visited .dot{fill:var(--seal);}
.stop .place{opacity:.62;}
.stop.visited .place,.stop.here .place,.stop.goal .place{opacity:1;}
.stop .ring{fill:none; stroke:none;}
.stop.here .ring{fill:none; stroke:var(--seal); stroke-width:2; animation:ring 1.8s ease-out infinite; transform-box:fill-box; transform-origin:center;}
@keyframes ring{from{transform:scale(.6); opacity:1;} to{transform:scale(1.8); opacity:0;}}
.label{font-family:var(--head-font); font-size:17px; fill:var(--ink); paint-order:stroke; stroke:var(--land); stroke-width:4px; stroke-linejoin:round;}
#traveller.walking .bob{animation:bob .35s ease-in-out infinite alternate;}
@keyframes bob{to{transform:translateY(-2px);}}

.satchel{color:var(--on-desk);}
.satchel h2{font-family:var(--head-font); font-weight:400; font-size:24px; margin:0 0 8px;}
.items{list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(auto-fill,minmax(74px,1fr)); gap:10px;}
.item{min-height:86px; border:2px dashed var(--on-desk); border-radius:6px; opacity:.55; background:var(--slot); display:grid; place-items:center; font-size:20px;}
.item.found{opacity:1; border:1px solid var(--page-edge); background:var(--page); color:var(--ink); align-content:center; gap:4px; padding:8px 4px; text-align:center; font-size:13px; line-height:1.25; box-shadow:0 4px 10px rgba(30,18,6,.25);}
.item.found svg{width:34px; height:34px;}
.item.fresh{animation:gain .5s ease-out;}
@keyframes gain{from{transform:scale(.6); opacity:0;} 60%{transform:scale(1.08);} to{transform:none; opacity:1;}}
.tally{margin:8px 0 0; font-size:16px;}

.page{
  position:relative; background:var(--page); color:var(--ink); border:1px solid var(--page-edge); border-radius:4px;
  padding:26px 22px 24px; box-shadow:0 2px 0 rgba(0,0,0,.08), 0 12px 26px rgba(30,18,6,.28);
  background-image:radial-gradient(ellipse at top left, rgba(255,255,255,.55), transparent 55%), radial-gradient(ellipse at bottom right, rgba(160,120,60,.12), transparent 60%);
}
.page::after{content:""; position:absolute; left:22px; right:22px; top:10px; height:6px; border-top:1px solid var(--page-edge); border-bottom:1px solid var(--page-edge);}
.kicker{font-size:15px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft); margin:0 0 10px;}
.inhabitant{display:flex; gap:12px; align-items:center; margin-bottom:10px;}
.medal{flex:none; width:48px; height:48px; border-radius:50%; display:grid; place-items:center; font-family:var(--head-font); font-size:24px; color:var(--ink); background:var(--tint); box-shadow:inset 0 0 0 2px var(--ink), inset 0 0 0 5px var(--page), inset 0 0 0 6px var(--ink);}
.inhabitant b{display:block; font-size:19px;}
.inhabitant span{color:var(--ink-soft); font-size:16px;}
.setup{font-style:italic; color:var(--ink-soft); margin:8px 0 14px;}
.prompt{font-size:21px; font-weight:700; line-height:1.4; margin:0 0 16px;}
.page p{max-width:62ch;}
.intro p{margin:0 0 12px;}
.guide{display:flex; gap:16px; align-items:flex-end; margin-bottom:12px;}
.guide svg{flex:none; width:96px; height:112px;}
.guide b{display:block; font-family:var(--head-font); font-weight:400; font-size:24px; line-height:1.15;}
.guide span{color:var(--ink-soft); font-size:16px;}
.quip{font-style:italic;}

.opts{display:grid; gap:10px;}
.scale{display:flex; flex-wrap:wrap; gap:8px;}
.scale button{width:46px; height:46px; border-radius:50%; padding:0; text-align:center;}
.scale-labels{display:flex; justify-content:space-between; gap:12px; font-size:15px; color:var(--ink-soft); margin-top:6px;}
button{font:inherit; color:inherit; cursor:pointer;}
.opt,.scale button{background:rgba(255,255,255,.45); border:2px solid var(--ink); border-radius:8px; padding:10px 14px; text-align:left;}
.scale button{border-radius:50%; padding:0; text-align:center;}
.opt:hover,.scale button:hover{background:var(--tint);}
.opt[aria-pressed="true"],.scale button[aria-pressed="true"]{background:var(--ink); color:var(--page);}
textarea{width:100%; min-height:110px; font:inherit; color:var(--ink); background:rgba(255,255,255,.6); border:2px solid var(--ink); border-radius:8px; padding:10px;}
.actions{display:flex; gap:12px; flex-wrap:wrap; margin-top:18px; align-items:center;}
.primary{background:var(--seal); color:var(--on-accent); border:none; border-radius:999px; padding:12px 24px; font-weight:700; box-shadow:inset 0 -3px 0 rgba(0,0,0,.25);}
.primary:disabled{opacity:.45; cursor:not-allowed;}
.ghost{background:none; border:none; text-decoration:underline; padding:8px 4px; color:var(--ink-soft);}
:focus-visible{outline:3px solid var(--focus); outline-offset:3px;}
[tabindex="-1"]:focus{outline:none;}

.reward{display:flex; gap:14px; align-items:center; margin:14px 0 6px; padding:14px; border:1px solid var(--page-edge); border-radius:8px; background:rgba(200,137,43,.12);}
:root[data-palette] .reward{background:var(--pal-tint);}
.reward svg{flex:none; width:56px; height:56px;}
.reward h3{margin:0; font-size:15px; font-weight:400; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft);}
.reward .item-name{margin:0; font-family:var(--head-font); font-size:24px; line-height:1.2;}
.reward .from{margin:0; font-size:16px; color:var(--ink-soft);}
.note{display:flex; gap:10px; align-items:flex-start; margin-top:14px;}
.note svg{flex:none; width:48px; height:56px;}
.note p{margin:0; font-style:italic;}
.end h2{font-family:var(--head-font); font-weight:400; font-size:32px; margin:0 0 8px;}
.summary{margin:16px 0 0; padding:0; list-style:none;}
.summary li{padding:8px 0; border-bottom:1px solid var(--page-edge);}
.summary small{display:block; color:var(--ink-soft); font-size:15px;}
details{margin-top:14px;}
summary{cursor:pointer; font-weight:700;}
pre{overflow-x:auto; background:rgba(51,38,26,.08); padding:12px; font-size:13px; border-radius:4px; white-space:pre;}
.sr-only{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;}

@media (min-width:900px){
  .layout{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); align-items:start; gap:28px;}
  .world{display:grid; gap:16px; position:sticky; top:16px; grid-column:1; grid-row:1;}
  #stage{grid-column:2; grid-row:1;}
}
@media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important;} }
</style>
<link rel="stylesheet" href="core/scenes.css">
</head>
<body>
<div class="wrap">
  <header class="tale">
    <div class="realm" id="realm"></div>
    <h1 id="questTitle"></h1>
    <div class="progress" id="progress"></div>
  </header>
  <div class="layout">
    <div class="world">
      <section class="map" id="mapBox" aria-label="Map"></section>
      <section class="satchel" id="satchel" aria-labelledby="satchelTitle">
        <h2 id="satchelTitle">Satchel</h2>
        <ol class="items" id="items"></ol>
        <p class="tally" id="tally"></p>
      </section>
    </div>
    <main id="stage"></main>
  </div>
  <p class="sr-only" id="announce" aria-live="polite"></p>
</div>

<script src="core/firebase-config.js"></script>
<script src="core/validators.js"></script>
<script src="core/qp.js"></script>
<script src="core/i18n.js"></script>
<script src="core/firestore.js"></script>
<script src="core/rewards.js"></script>
<script src="core/voice.js"></script>
<script src="core/scenes.js"></script>
<script src="core/banners.js"></script>
<script src="samples/rpg.js"></script>
<script src="rpg.js"></script>
</body>
</html>

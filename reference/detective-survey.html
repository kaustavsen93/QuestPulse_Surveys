<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Case File: Detective Survey Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --cork:#C59B6D; --cork-dot:#A97F52; --card:#FFFDF7; --rule:#B9CDE4; --margin:#D9534F;
  --ink:#1E2A3A; --ink-soft:#4A5668; --stamp:#B3261E; --pin:#2F6B4F; --on-cork:#2A1C10;
  --slot:#E9D6BC;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --cork:#3B2B1D; --cork-dot:#2C1F14; --card:#EFE6D4; --rule:#A9BCD2; --on-cork:#F6EAD6; --slot:#4A3726;
  }
}
:root[data-theme="dark"]{
  --cork:#3B2B1D; --cork-dot:#2C1F14; --card:#EFE6D4; --rule:#A9BCD2; --on-cork:#F6EAD6; --slot:#4A3726;
}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:inherit;}
body{
  margin:0; min-height:100%;
  background-color:var(--cork);
  background-image:radial-gradient(var(--cork-dot) 1px, transparent 1.6px), radial-gradient(var(--cork-dot) 1px, transparent 1.6px);
  background-size:14px 14px, 22px 22px; background-position:0 0, 7px 11px;
  font-family:"Courier Prime","Courier New",Courier,monospace;
  color:var(--ink); font-size:17px; line-height:1.55;
}
.wrap{max-width:720px; margin:0 auto; padding:20px 16px 40px;}
header.case{color:var(--on-cork); margin-bottom:18px;}
header.case .num{font-size:14px; opacity:.85;}
header.case h1{font-family:"Alfa Slab One",Georgia,serif; font-weight:400; font-size:clamp(26px,6vw,40px); line-height:1.1; margin:4px 0 0;}

.card{
  position:relative; background:var(--card); border-radius:3px; padding:44px 22px 24px 40px;
  background-image:linear-gradient(to right, transparent 26px, var(--margin) 26px, var(--margin) 27px, transparent 27px),
    repeating-linear-gradient(to bottom, transparent 0, transparent 27px, var(--rule) 27px, var(--rule) 28px);
  background-position:0 0, 0 16px;
  box-shadow:0 2px 0 rgba(0,0,0,.12), 0 10px 24px rgba(40,20,0,.28);
  transform:rotate(-.4deg);
}
.card::before{ /* pushpin */
  content:""; position:absolute; top:12px; left:50%; width:16px; height:16px; margin-left:-8px; border-radius:50%;
  background:radial-gradient(circle at 35% 35%, #6fae8c, var(--pin) 60%); box-shadow:0 2px 3px rgba(0,0,0,.35);
}
.witness{display:flex; gap:12px; align-items:center; margin-bottom:10px;}
.badge{flex:none; width:44px; height:44px; border-radius:50%; border:2px solid var(--ink); display:grid; place-items:center; font-weight:700; font-size:18px;}
.witness b{display:block; font-size:18px;}
.witness span{color:var(--ink-soft); font-size:15px;}
.setup{font-style:italic; color:var(--ink-soft); margin:8px 0 14px;}
.prompt{font-size:20px; font-weight:700; line-height:1.4; margin:0 0 16px;}
.intro p{margin:0 0 12px; max-width:60ch;}

.opts{display:grid; gap:10px;}
.scale{display:flex; flex-wrap:wrap; gap:8px;}
.scale button{width:46px; height:46px;}
.scale-labels{display:flex; justify-content:space-between; font-size:14px; color:var(--ink-soft); margin-top:6px; max-width:100%;}
button{font:inherit; color:inherit; cursor:pointer;}
.opt, .scale button{
  background:transparent; border:2px solid var(--ink); border-radius:3px; padding:10px 14px; text-align:left;
}
.opt[aria-pressed="true"], .scale button[aria-pressed="true"]{background:var(--ink); color:var(--card);}
.scale button{text-align:center; padding:0;}
textarea{width:100%; min-height:110px; font:inherit; color:var(--ink); background:rgba(255,255,255,.55); border:2px solid var(--ink); border-radius:3px; padding:10px;}
.actions{display:flex; gap:12px; flex-wrap:wrap; margin-top:18px; align-items:center;}
.primary{background:var(--stamp); color:#fff; border:none; border-radius:3px; padding:12px 20px; font-weight:700;}
.primary:disabled{opacity:.4; cursor:not-allowed;}
.ghost{background:none; border:none; text-decoration:underline; padding:8px 4px; color:var(--ink-soft);}
:focus-visible{outline:3px solid #2B6CB0; outline-offset:3px;}

.evidence{margin-top:16px; border:2px dashed var(--stamp); padding:14px; border-radius:3px; background:rgba(179,38,30,.06);}
.evidence h3{margin:0 0 6px; font-size:16px; color:var(--stamp);}

.board{margin-top:26px; color:var(--on-cork);}
.board h2{font-family:"Alfa Slab One",Georgia,serif; font-weight:400; font-size:20px; margin:0 0 10px;}
.slots{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px;}
.slot{min-height:92px; border:2px dashed var(--on-cork); opacity:.55; border-radius:3px; display:grid; place-items:center; font-size:28px; background:var(--slot);}
.slot.found{opacity:1; border:none; background:var(--card); color:var(--ink); font-size:14px; line-height:1.4; padding:22px 12px 12px; place-items:start; position:relative; box-shadow:0 6px 14px rgba(40,20,0,.3);}
.slot.found:nth-child(odd){transform:rotate(1.2deg);} .slot.found:nth-child(even){transform:rotate(-1deg);}
.slot.found::before{content:""; position:absolute; top:6px; left:50%; width:12px; height:12px; margin-left:-6px; border-radius:50%; background:var(--stamp);}
.slot.fresh{animation:pin .45s ease-out;}
@keyframes pin{from{transform:translateY(-14px) scale(1.06); opacity:0;} to{opacity:1;}}

.stamp{
  position:absolute; right:18px; top:30px; font-family:"Alfa Slab One",Georgia,serif; color:var(--stamp);
  border:4px solid var(--stamp); padding:4px 12px; font-size:clamp(20px,5vw,30px); transform:rotate(-12deg); opacity:.85;
  animation:thud .5s cubic-bezier(.2,1.6,.4,1) both;
}
@keyframes thud{from{transform:rotate(-12deg) scale(2.4); opacity:0;} to{transform:rotate(-12deg) scale(1); opacity:.85;}}
.summary{margin:16px 0 0; padding:0; list-style:none;}
.summary li{padding:8px 0; border-bottom:1px solid var(--rule);}
.summary small{display:block; color:var(--ink-soft);}
details{margin-top:14px;}
summary{cursor:pointer; font-weight:700;}
pre{overflow-x:auto; background:rgba(30,42,58,.08); padding:12px; font-size:13px; border-radius:3px; white-space:pre;}
.progress{font-size:15px; margin-top:6px;}
.detective{display:flex; gap:16px; align-items:flex-end; margin-bottom:14px;}
.detective svg{flex:none; width:96px; height:112px;}
.detective .who b{display:block; font-family:"Alfa Slab One",Georgia,serif; font-weight:400; font-size:20px; line-height:1.2;}
.detective .who span{color:var(--ink-soft); font-size:15px;}
.quip{font-style:italic; margin:0 0 12px;}
.note{display:flex; gap:10px; align-items:flex-start; margin-top:14px;}
.note svg{flex:none; width:48px; height:56px;}
.note p{margin:0; font-style:italic;}
@media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important;} }
</style>
</head>
<body>
<div class="wrap">
  <header class="case">
    <div class="num" id="caseNum"></div>
    <h1 id="caseTitle"></h1>
    <div class="progress" id="progress"></div>
  </header>
  <main id="stage"></main>
  <section class="board" aria-label="Evidence board">
    <h2>Evidence board</h2>
    <div class="slots" id="slots"></div>
  </section>
</div>

<script>
/* ------------------------------------------------------------------
   CASE CONFIG — this is the JSON the AI (e.g. Gemini) generates from
   the company's survey goal. The game engine below never changes;
   only this config does.
------------------------------------------------------------------- */
let CASE = {
  caseId: "northwind-q4-engagement",
  caseNumber: "Case No. 0417",
  title: "The vanishing coffee machine",
  company: "Northwind Office",
  detective: {
    name: "Inspector Juniper Vale",
    title: "Northwind's least official detective",
    introLine: "Good morning. I'm Inspector Vale, and I've never met a mystery I couldn't solve with a little help. Today, that help is you.",
    catchphrase: "Every answer is a clue.",
    look: { hat:"fedora", coatColor:"#6B4F3A", accentColor:"#B3261E", skinTone:"#C68E63", accessory:"magnifier" }
  },
  intro: [
    "Monday, 9:02 a.m. The third-floor coffee machine is gone.",
    "Six people saw something this morning. Each one will share a clue, but only after you answer their question.",
    "Your answers are anonymous. There are no right or wrong answers."
  ],
  questions: [
    { id:"q1", type:"rating", scale:5, labels:["Very dissatisfied","Very satisfied"],
      witness:{ name:"Rosa", role:"Receptionist", initial:"R" },
      setup:"Rosa closes the visitor log. \"I'll tell you what I saw. First, a question for you.\"",
      prompt:"Overall, how satisfied are you working here?",
      clue:"The visitor log shows an entry at 8:41 a.m. The signature is smudged.",
      detectiveNote:"A smudged signature. Someone was in a hurry." },
    { id:"q2", type:"choice", options:["Rarely","Once or twice a week","Most days","Every day"],
      witness:{ name:"Dev", role:"Early-shift engineer", initial:"D" },
      setup:"Dev looks up from his screen. \"I was here at six. Before I go on, let me ask you something.\"",
      prompt:"In a typical week, how often do you feel your workload is too heavy?",
      clue:"Wheel marks on the carpet lead toward the service lift.",
      detectiveNote:"Wheels, not footprints. Something heavy was moved." },
    { id:"q3", type:"choice", options:["Yes, regularly","Sometimes","Rarely","Never"],
      witness:{ name:"Mei", role:"Team lead", initial:"M" },
      setup:"Mei pauses by the window. \"Something's been on my mind. Can I ask you first?\"",
      prompt:"Do you feel your work is recognised?",
      clue:"A sticky note on her desk: \"Room 3B. Keep it quiet until Friday.\"",
      detectiveNote:"Quiet until Friday. That sounds like a surprise, not a theft." },
    { id:"q4", type:"choice", options:["Workload","Communication","Growth opportunities","Workspace and facilities"],
      witness:{ name:"Camera 2", role:"Corridor security footage", initial:"C2" },
      setup:"The footage is paused. A note on the monitor asks every viewer one question.",
      prompt:"Which area most needs improvement?",
      clue:"7:55 a.m. Two people carry a large box past the lifts.",
      detectiveNote:"Two people, one big box, and nobody hiding their faces." },
    { id:"q5", type:"text", optional:true,
      witness:{ name:"Anonymous tip", role:"Note left under your door", initial:"?" },
      setup:"The note says: \"I'll tell you where to look. Tell me one thing in return.\"",
      prompt:"What one change would most improve your workday?",
      clue:"A delivery receipt for break-room furniture, signed for Room 3B.",
      detectiveNote:"Break-room furniture. The pieces are fitting together." },
    { id:"q6", type:"nps", labels:["Not at all likely","Extremely likely"],
      witness:{ name:"Arjun", role:"Facilities manager", initial:"A" },
      setup:"Arjun holds up a key. \"Last question, and then it's yours.\"",
      prompt:"How likely are you to recommend Northwind as a place to work?",
      clue:"The key to Room 3B.",
      detectiveNote:"A key. Let's open Room 3B." }
  ],
  solution:"Nobody stole the coffee machine. Facilities moved it to the new break room in 3B, which was built from last quarter's survey answers. What you shared today decides what gets built next."
};

/* ------------------------------ ENGINE ------------------------------ */
const $ = s => document.querySelector(s);
const stage = $("#stage"), slots = $("#slots");
let idx = -1, answers = {}, times = {}, qStart = 0, startedAt = null, pending = null, justFound = null;

function setHeader(){
  $("#caseNum").textContent = `${CASE.caseNumber}, ${CASE.company}`;
  $("#caseTitle").textContent = CASE.title;
  document.title = "Case file: " + CASE.title;
}

/* Draws the detective from the AI-chosen "look" parameters */
function drawDetective(look = {}){
  const coat = look.coatColor || "#6B4F3A", accent = look.accentColor || "#B3261E", skin = look.skinTone || "#C68E63";
  const hats = {
    fedora:`<path d="M30 40 Q60 30 90 40 L84 44 Q60 38 36 44Z" fill="#2B2B2B"/><path d="M40 42 Q42 18 60 18 Q78 18 80 42Z" fill="#2B2B2B"/><rect x="40" y="35" width="40" height="5" fill="${accent}"/>`,
    deerstalker:`<path d="M38 44 Q40 16 60 16 Q80 16 82 44Z" fill="#8A6F4D"/><path d="M36 44 L28 50 L42 46Z M84 44 L92 50 L78 46Z" fill="#8A6F4D"/><path d="M44 28 H76 M42 36 H78" stroke="${accent}" stroke-width="2"/>`,
    beret:`<ellipse cx="62" cy="34" rx="26" ry="11" fill="${accent}"/><circle cx="62" cy="22" r="3" fill="${accent}"/>`,
    cap:`<path d="M40 42 Q42 20 60 20 Q78 20 80 42Z" fill="${accent}"/><path d="M78 40 L96 44 L78 44Z" fill="${accent}"/>`
  };
  const items = {
    magnifier:`<line x1="94" y1="104" x2="104" y2="122" stroke="#3A3A3A" stroke-width="5" stroke-linecap="round"/><circle cx="88" cy="94" r="12" fill="#DDEBF5" fill-opacity=".7" stroke="#3A3A3A" stroke-width="4"/>`,
    notebook:`<rect x="82" y="88" width="20" height="26" rx="2" fill="#F5E9C8" stroke="#3A3A3A" stroke-width="2"/><line x1="86" y1="96" x2="98" y2="96" stroke="#3A3A3A"/><line x1="86" y1="102" x2="98" y2="102" stroke="#3A3A3A"/>`,
    umbrella:`<line x1="96" y1="70" x2="96" y2="130" stroke="#2B2B2B" stroke-width="3"/><path d="M96 130 q0 6 -6 6" fill="none" stroke="#2B2B2B" stroke-width="3"/>`
  };
  return `<svg viewBox="0 0 120 140" role="img" aria-label="Detective character">
    <path d="M28 140 L36 78 Q60 66 84 78 L92 140Z" fill="${coat}"/>
    <path d="M60 74 L52 100 L60 96 L68 100Z" fill="#F4F0E6"/>
    <line x1="60" y1="96" x2="60" y2="140" stroke="#00000033" stroke-width="2"/>
    <circle cx="60" cy="52" r="18" fill="${skin}"/>
    <circle cx="53" cy="52" r="2.2" fill="#1E1E1E"/><circle cx="67" cy="52" r="2.2" fill="#1E1E1E"/>
    <path d="M54 60 Q60 64 66 60" fill="none" stroke="#1E1E1E" stroke-width="2" stroke-linecap="round"/>
    ${hats[look.hat] || hats.fedora}
    ${items[look.accessory] || items.magnifier}
  </svg>`;
}
function detectiveSvg(){ const d = document.createElement("div"); d.innerHTML = drawDetective(CASE.detective && CASE.detective.look); return d.firstElementChild; }

/* Checks an AI-generated config before the game uses it */
function validateCase(c){
  const errs = [], types = ["rating","choice","text","nps"];
  ["caseId","caseNumber","title","company","solution"].forEach(k => { if (typeof c[k] !== "string" || !c[k]) errs.push("Missing " + k); });
  if (!Array.isArray(c.intro) || !c.intro.length) errs.push("Missing intro");
  if (!c.detective || !c.detective.name || !c.detective.introLine) errs.push("Missing detective");
  if (!Array.isArray(c.questions) || c.questions.length < 3) errs.push("Need at least 3 questions");
  (c.questions || []).forEach((q,i) => {
    const at = `Question ${i+1}: `;
    if (!types.includes(q.type)) errs.push(at + "unknown type " + q.type);
    if (!q.prompt || !q.clue || !q.witness || !q.witness.name) errs.push(at + "missing prompt, clue or witness");
    if (q.type === "choice" && (!Array.isArray(q.options) || q.options.length < 2)) errs.push(at + "choice needs 2+ options");
    if (q.type === "rating" && !(q.scale >= 3 && q.scale <= 10)) errs.push(at + "rating scale must be 3 to 10");
    if ((q.type === "rating" || q.type === "nps") && (!Array.isArray(q.labels) || q.labels.length !== 2)) errs.push(at + "needs 2 end labels");
  });
  return errs;
}

/* Call this from your app with Gemini's parsed JSON */
window.startCase = function(config){
  const errs = validateCase(config);
  if (errs.length){ console.error("Case config rejected:", errs); return { ok:false, errors:errs }; }
  CASE = config; idx = -1; answers = {}; times = {};
  setHeader(); renderIntro();
  return { ok:true };
};
setHeader();

function el(tag, attrs = {}, ...kids){
  const n = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)){
    if (k === "class") n.className = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  kids.flat().forEach(c => n.append(c instanceof Node ? c : document.createTextNode(c)));
  return n;
}

function renderBoard(){
  slots.innerHTML = "";
  CASE.questions.forEach((q,i) => {
    const found = answers.hasOwnProperty(q.id);
    const s = el("div", {class:"slot" + (found ? " found" : "") + (q.id === justFound ? " fresh" : "")},
      found ? q.clue : "?");
    if (!found) s.setAttribute("aria-label", "Clue " + (i+1) + " not found yet");
    slots.append(s);
  });
  const n = Object.keys(answers).length;
  $("#progress").textContent = idx < 0 ? "" : `Clues found: ${n} of ${CASE.questions.length}`;
  justFound = null;
}

function renderIntro(){
  stage.innerHTML = "";
  const d = CASE.detective;
  stage.append(el("div", {class:"card intro"},
    el("div", {class:"detective"}, detectiveSvg(),
      el("div", {class:"who"}, el("b", {}, d.name), el("span", {}, d.title || "Detective"))),
    el("p", {class:"quip"}, d.introLine),
    CASE.intro.map(p => el("p", {}, p)),
    d.catchphrase ? el("p", {}, el("b", {}, d.catchphrase)) : "",
    el("div", {class:"actions"},
      el("button", {class:"primary", onclick:() => { startedAt = new Date().toISOString(); idx = 0; renderQuestion(); }}, "Open the case"))
  ));
  renderBoard();
}

function choiceButtons(values, cls, onPick){
  return values.map(v => el("button", {class:cls, "aria-pressed":"false", onclick:e => {
    e.currentTarget.parentElement.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed","false"));
    e.currentTarget.setAttribute("aria-pressed","true"); onPick(v);
  }}, String(v)));
}

function renderQuestion(){
  const q = CASE.questions[idx]; pending = null; qStart = performance.now();
  const log = el("button", {class:"primary", disabled:"", onclick:() => record(q, pending)}, "Log answer");
  const ready = v => { pending = v; log.disabled = (v === null || v === ""); };
  let control;

  if (q.type === "rating" || q.type === "nps"){
    const range = q.type === "nps" ? [...Array(11).keys()] : [...Array(q.scale).keys()].map(i => i+1);
    control = el("div", {}, el("div", {class:"scale", role:"group", "aria-label":q.prompt}, choiceButtons(range, "", ready)),
      el("div", {class:"scale-labels"}, el("span", {}, q.labels[0]), el("span", {}, q.labels[1])));
  } else if (q.type === "choice"){
    control = el("div", {class:"opts", role:"group", "aria-label":q.prompt}, choiceButtons(q.options, "opt", ready));
  } else {
    const ta = el("textarea", {"aria-label":q.prompt, placeholder:"Write your answer here"});
    ta.addEventListener("input", () => ready(ta.value.trim()));
    control = ta;
  }

  const actions = el("div", {class:"actions"}, log);
  if (q.optional) actions.append(el("button", {class:"ghost", onclick:() => record(q, null)}, "Skip this one"));

  stage.innerHTML = "";
  stage.append(el("div", {class:"card"},
    el("div", {class:"witness"}, el("div", {class:"badge", "aria-hidden":"true"}, q.witness.initial),
      el("div", {}, el("b", {}, q.witness.name), el("span", {}, q.witness.role))),
    el("p", {class:"setup"}, q.setup),
    el("p", {class:"prompt", id:"prompt"}, q.prompt),
    control, actions
  ));
  renderBoard();
  stage.querySelector("button, textarea").focus({preventScroll:true});
}

function record(q, value){
  answers[q.id] = value;
  times[q.id] = Math.round(performance.now() - qStart);
  justFound = q.id;
  const last = idx === CASE.questions.length - 1;
  stage.innerHTML = "";
  stage.append(el("div", {class:"card"},
    el("div", {class:"witness"}, el("div", {class:"badge", "aria-hidden":"true"}, q.witness.initial),
      el("div", {}, el("b", {}, q.witness.name), el("span", {}, "Statement logged"))),
    el("div", {class:"evidence", role:"status"}, el("h3", {}, "New clue pinned to the board"), el("p", {style:"margin:0"}, q.clue)),
    q.detectiveNote ? el("div", {class:"note"}, detectiveSvg(),
      el("p", {}, `${CASE.detective.name}: "${q.detectiveNote}"`)) : "",
    el("div", {class:"actions"}, el("button", {class:"primary", onclick:() => {
      if (last) renderClosed(); else { idx++; renderQuestion(); }
    }}, last ? "Solve the case" : "Next witness"))
  ));
  renderBoard();
  stage.querySelector(".primary").focus({preventScroll:true});
}

function renderClosed(){
  const response = {
    caseId: CASE.caseId, startedAt, completedAt: new Date().toISOString(),
    answers, msPerQuestion: times,
    flags: { tooFast: Object.entries(times).filter(([,ms]) => ms < 1500).map(([id]) => id) }
  };
  stage.innerHTML = "";
  stage.append(el("div", {class:"card"},
    el("div", {class:"stamp", "aria-hidden":"true"}, "Case closed"),
    el("p", {class:"prompt", style:"max-width:70%"}, "Solved."),
    el("div", {class:"note"}, detectiveSvg(), el("p", {}, `${CASE.detective.name}: "${CASE.solution}"`)),
    el("p", {}, "Thank you for your statements."),
    el("ul", {class:"summary"}, CASE.questions.map(q =>
      el("li", {}, el("small", {}, q.prompt), answers[q.id] === null ? "Skipped" : String(answers[q.id])))),
    el("details", {}, el("summary", {}, "Response record sent to analytics"), el("pre", {}, JSON.stringify(response, null, 2))),
    el("details", {}, el("summary", {}, "Case config generated by AI"), el("pre", {}, JSON.stringify(CASE, null, 2))),
    el("div", {class:"actions"}, el("button", {class:"ghost", onclick:() => {
      idx = -1; answers = {}; times = {}; renderIntro(); }}, "Start the case again"))
  ));
  $("#progress").textContent = "Case closed";
  renderBoard();
}

renderIntro();
</script>
</body>
</html>
